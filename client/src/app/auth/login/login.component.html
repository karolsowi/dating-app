<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="text-center my-4">
        <img src="/logo.png" alt="Grinding Logo" style="max-width: 300px; height: auto;" class="mb-2">
        <h3 class="text-primary">Login</h3>
      </div>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="row mb-3 justify-content-center">
          <label for="email" class="col-3 text-end col-form-label">Email address</label>
          <div class="col-7">
            <input type="email" class="form-control" id="email" formControlName="email" [ngClass]="{
                'is-invalid': loginForm.get('email')?.touched && loginForm.get('email')?.invalid
              }" />
            <div class="invalid-feedback">Please enter a valid email.</div>
          </div>
        </div>
        <div class="row mb-3 justify-content-center">
          <label for="password" class="col-3 text-end col-form-label">Password</label>
          <div class="col-7">
            <input type="password" class="form-control" id="password" formControlName="password" [ngClass]="{
                'is-invalid':
                  loginForm.get('password')?.touched && loginForm.get('password')?.invalid
              }" />
            <div class="invalid-feedback">Password is required.</div>
          </div>
        </div>

        <div class="row mb-3 justify-content-center">
          <div class="col-3"></div>
          <div class="col-7">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe" />
              <label class="form-check-label" for="rememberMe"> Remember me </label>
            </div>
          </div>
        </div>

        <div *ngIf="error" class="alert alert-danger">
          {{ error }}
        </div>
        <div class="row justify-content-center">
          <button type="submit" class="btn btn-primary btn-lg col-3 mt-4" [disabled]="loginForm.invalid">
            Sign in
          </button>
        </div>
      </form>
      <div class="mt-3 text-center">
        <p>Don't have an account? <a routerLink="/auth/register">Sign up here!</a></p>
      </div>
    </div>
  </div>
</div>
