<app-navbar></app-navbar>

<div class="container-fluid border-top">
  <div class="row">
    <!-- Left Sidebar -->
    <div class="col-md-3 col-lg-2 sidebar border-end pt-4 bg-white">
      <h5 class="ms-3 mb-4 text-uppercase text-primaryy"
        style="color: #2c3e50; font-weight: bold; letter-spacing: 1px;">Settings</h5>

      <div class="list-group list-group-flush">
        <a routerLink="edit" routerLinkActive="btn-sidebar-active"
          class="list-group-item list-group-item-action border-0 py-3">Edit profile</a>
        <a routerLink="notifications" routerLinkActive="btn-sidebar-active"
          class="list-group-item list-group-item-action border-0 py-3">Notifications</a>
        <a routerLink="subscription" routerLinkActive="btn-sidebar-active"
          class="list-group-item list-group-item-action border-0 py-3">Subscription</a>
        <a routerLink="general" routerLinkActive="btn-sidebar-active"
          class="list-group-item list-group-item-action border-0 py-3">General</a>
        <a routerLink="blocked" routerLinkActive="btn-sidebar-active"
          class="list-group-item list-group-item-action border-0 py-3">Blocked accounts</a>
        <a routerLink="help" routerLinkActive="btn-sidebar-active"
          class="list-group-item list-group-item-action border-0 py-3">Help</a>

        <div class="mt-4 px-3">
          <button (click)="onLogout()" class="btn btn-logout w-100">Log out</button>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="col-md-9 col-lg-8 p-5">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>

<app-promo-footer></app-promo-footer>
