<app-navbar></app-navbar>
<div class="container mt-4 h-100">
    <div class="row justify-content-center h-100">
        <div class="col-md-8">
            <div class="card shadow h-100">
                <div class="card-header bg-white d-flex align-items-center">
                    <img [src]="otherUser?.profilePic || 'https://via.placeholder.com/50x50?text=User'"
                        class="rounded-circle me-3" width="50" height="50" alt="Avatar">
                    <h4 class="mb-0">{{ otherUser?.name || 'Chat' }}</h4>
                </div>

                <div class="card-body chat-box" #scrollMe style="height: 400px; overflow-y: auto;">
                    <div *ngFor="let msg of messages"
                        [ngClass]="{'text-end': msg.fromUserId === currentUser.id, 'text-start': msg.fromUserId !== currentUser.id}"
                        class="mb-3">
                        <div class="d-inline-block p-2 rounded"
                            [ngClass]="{'bg-primary text-white': msg.fromUserId === currentUser.id, 'bg-light text-dark border': msg.fromUserId !== currentUser.id}"
                            style="max-width: 75%;">
                            {{ msg.content }}
                        </div>
                        <div class="small text-muted mt-1">
                            {{ msg.timestamp | date:'shortTime' }}
                        </div>
                    </div>
                </div>

                <div class="card-footer bg-white">
                    <div class="input-group">
                        <input type="text" class="form-control" placeholder="Type a message..." [(ngModel)]="newMessage"
                            (keyup.enter)="sendMessage()">
                        <button class="btn btn-primary" type="button" (click)="sendMessage()">
                            <i class="bi bi-send"></i> Send
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
