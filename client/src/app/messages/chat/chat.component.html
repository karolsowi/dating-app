<app-navbar></app-navbar>

<div
  class="container-fluid overflow-hidden"
  style="height: calc(100vh - 65px)"
  *ngIf="initialId || conversations.length > 0; else noConvosView"
>
  <div class="row chat-row">
    <!-- LEFT SIDEBAR: Conversations -->
    <div class="col-3 border-end p-0">
      <div class="border-bottom p-3 d-flex align-items-center shadow-sm" style="height: 83px">
        <h4 class="mb-0">Chats</h4>
      </div>

      <div class="list-group list-group-flush" style="height: 100%; overflow-y: auto">
        <button
          *ngFor="let convo of conversations"
          class="list-group-item list-group-item-action d-flex align-items-center"
          [class.active]="convo.id === otherUser?.id"
          (click)="openChat(convo.userId)"
        >
          <img
            *ngIf="convo.pictures?.[0]; else noPicSmall"
            [src]="convo.pictures[0]"
            class="rounded-circle me-2"
            width="40"
            height="40"
          />

          <ng-template #noPicSmall>
            <i class="bi bi-person-circle fs-2 me-3"></i>
          </ng-template>

          <div>
            <div class="fw-bold">{{ convo.name }}</div>
            <small class="text-muted">{{ convo.lastMessage }}</small>
          </div>
        </button>
      </div>
    </div>

    <!-- MIDDLE: Chat -->
    <div class="col-6 d-flex flex-column p-0 chat-column">
      <!-- Chat Header -->
      <div class="border-bottom p-3 d-flex align-items-center shadow-sm">
        <ng-container *ngIf="otherUser?.pictures?.[0]; else noPicBig">
          <img [src]="otherUser.pictures[0]" class="rounded-circle me-3" width="50" height="50" />
        </ng-container>

        <ng-template #noPicBig>
          <i class="bi bi-person-circle fs-2 ms-1 me-4 text" style="height: 50px"></i>
        </ng-template>

        <h4 class="mb-0 fw-semibold">{{ otherUser?.name }}, {{ otherUser?.age }}</h4>
      </div>

      <!-- Chat Messages -->
      <div class="flex-grow-1 p-3 chat-messages" #scrollMe style="overflow-y: auto; min-height: 0">
        <div
          *ngFor="let msg of messages"
          class="mb-3"
          [ngClass]="{
            'text-end': msg.fromUserId === currentUser?.id,
            'text-start': msg.fromUserId !== currentUser?.id,
          }"
        >
          <div
            class="d-inline-block p-2 rounded"
            [ngClass]="{
              'bg-primary text-white': msg.fromUserId === currentUser?.id,
              'bg-secondary-subtle': msg.fromUserId !== currentUser?.id,
            }"
            style="max-width: 75%"
          >
            {{ msg.content }}
          </div>
          <div class="small text-muted mt-1">
            {{ msg.timestamp | date: 'shortTime' }}
          </div>
        </div>
      </div>

      <!-- Chat Input -->
      <div class="border-top p-3">
        <div class="input-group">
          <input
            type="text"
            class="form-control"
            placeholder="Type a message..."
            [(ngModel)]="newMessage"
            (keyup.enter)="sendMessage()"
          />
          <button class="btn btn-primary" (click)="sendMessage()">
            <i class="bi bi-send"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- RIGHT SIDEBAR: Shared Media -->
    <div class="col-3 border-start p-0">
      <div class="border-bottom p-3 d-flex align-items-center shadow-sm" style="height: 83px">
        <h4 class="mb-0">Shared media</h4>
      </div>
      <p class="text-muted p-3">No shared pictures yet</p>
    </div>
  </div>
</div>

<ng-template #noConvosView>
  <div
    class="mt-5 row justify-content-center"
  >
    <!-- No Conversations Card -->
    <div class="col-lg-4 col-md-6 mb-4">
      <div class="card border-secondary shadow-sm" [@transition]>
        <div class="card-body text-center py-5">
          <i class="bi bi-chat-heart fs-1 text-muted mb-3"></i>
          <h3 class="text-muted">No chats yet!</h3>
          <p class="text-muted">
            Your inbox is looking a little lonely. Start a conversation with one of your matches to
            see them here!
          </p>
          <button class="btn btn-outline-primary btn-lg rounded-pill px-5 shadow-sm" (click)="goToHome()">
            <i class="bi bi-arrow-right-circle me-2"></i>Find Matches
          </button>
        </div>
      </div>
    </div>
  </div>
</ng-template>
