<app-navbar></app-navbar>

<div class="container-fluid mt-3" style="height: calc(100vh - 80px)">
  <div class="row h-100">

    <!-- LEFT SIDEBAR: Conversations -->
    <div class="col-3 border-end p-0">
      <div class="list-group list-group-flush" style="height: 100%; overflow-y: auto">
        <button
          *ngFor="let convo of conversations"
          class="list-group-item list-group-item-action d-flex align-items-center"
          [class.active]="convo.id === otherUser?.id"
          (click)="openChat(convo.userId)"
        >
          <img
            *ngIf="convo.pictures?.[0]; else noPicSmall"
            [src]="convo.pictures[0]"
            class="rounded-circle me-2"
            width="40"
            height="40"
          />

          <ng-template #noPicSmall>
            <i class="bi bi-person-circle fs-3 me-2"></i>
          </ng-template>

          <div>
            <div class="fw-bold">{{ convo.name }}</div>
            <small class="text-muted">{{ convo.lastMessage }}</small>
          </div>
        </button>
      </div>
    </div>

    <!-- MIDDLE: Chat -->
    <div class="col-6 d-flex flex-column p-0">

      <!-- Chat Header -->
      <div class="border-bottom p-3 d-flex align-items-center">
        <ng-container *ngIf="otherUser?.pictures?.[0]; else noPicBig">
          <img
            [src]="otherUser.pictures[0]"
            class="rounded-circle me-3"
            width="50"
            height="50"
          />
        </ng-container>

        <ng-template #noPicBig>
          <i class="bi bi-person-circle fs-1 me-3"></i>
        </ng-template>

        <h4 class="mb-0">{{ otherUser?.name }}, {{ otherUser?.age }}</h4>
      </div>

      <!-- Chat Messages -->
      <div
        class="flex-grow-1 p-3"
        #scrollMe
        style="overflow-y: auto"
      >
        <div
          *ngFor="let msg of messages"
          class="mb-3"
          [ngClass]="{
            'text-end': msg.fromUserId === currentUser?.id,
            'text-start': msg.fromUserId !== currentUser?.id
          }"
        >
          <div
            class="d-inline-block p-2 rounded"
            [ngClass]="{
              'bg-primary text-white': msg.fromUserId === currentUser?.id,
              'bg-light border': msg.fromUserId !== currentUser?.id
            }"
            style="max-width: 75%"
          >
            {{ msg.content }}
          </div>
          <div class="small text-muted mt-1">
            {{ msg.timestamp | date: 'shortTime' }}
          </div>
        </div>
      </div>

      <!-- Chat Input -->
      <div class="border-top p-3">
        <div class="input-group">
          <input
            type="text"
            class="form-control"
            placeholder="Type a message..."
            [(ngModel)]="newMessage"
            (keyup.enter)="sendMessage()"
          />
          <button class="btn btn-primary" (click)="sendMessage()">
            <i class="bi bi-send"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- RIGHT SIDEBAR: Shared Media -->
    <div class="col-3 border-start p-3">
      <h5>Shared Media</h5>
      <hr />
      <p class="text-muted">No shared pictures yet</p>
    </div>

  </div>
</div>
