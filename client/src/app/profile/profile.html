<app-navbar></app-navbar>

<div class="container mt-4 mb-5 pb-5">
    <div *ngIf="loading" class="text-center mt-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div *ngIf="error" class="alert alert-danger mt-4">
        {{ error }}
    </div>

    <div *ngIf="!loading && !error && user" class="row">
        <!-- Left Column: Profile Card & Details -->
        <div [ngClass]="displayPhotos.length > 0 ? 'col-md-5 col-lg-4' : 'col-md-4 offset-md-4'">
            <!-- 1. Profile Main Card -->
            <div class="card border-secondary shadow-sm mb-4">
                <div class="bg-secondary-subtle position-relative" style="aspect-ratio: 1; overflow: hidden">
                    <img [src]="user.displayProfilePic || 'https://via.placeholder.com/300'" alt="{{ user.name }}"
                        class="position-absolute top-0 w-100 h-100 object-fit-cover">
                </div>
                <div class="card-body">
                    <h3 class="mb-0 fw-semibold">
                        {{ user.name }}, {{ age }}
                    </h3>
                    <span class="d-block fs-6 text-muted fw-normal">{{ user.city || 'Warsaw' }}</span>
                </div>
            </div>

            <!-- 2. About Me Card -->
            <div class="card border-primary mb-4 shadow-sm">
                <div class="card-header bg-primary-subtle">
                    <h5 class="fw-semibold mb-0">About me:</h5>
                </div>
                <div class="card-body">
                    <p class="text-dark mb-0" style="white-space: pre-wrap;">{{ user.bio || 'No bio provided.' }}</p>
                </div>
            </div>

            <!-- 3. Looking For Card -->
            <span class="text-muted d-block mb-2"> I am looking for... </span>
            <div class="card border-primary mb-4 shadow-sm">
                <div class="card-body">
                    <div class="d-flex flex-wrap gap-2">
                        <ng-container *ngFor="let badgeId of user.badgeIds">
                            <span *ngIf="getBadge(badgeId) as badge"
                                class="badge rounded-pill border text-dark fs-6 display-badge">
                                <span>{{ badge.emoji }}</span> {{ badge.text }}
                            </span>
                        </ng-container>
                        <span *ngIf="!user.badgeIds?.length" class="text-muted small">Not specified</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Column: Gallery Grid -->
        <div class="col-md-7 col-lg-8" *ngIf="displayPhotos.length > 0">
            <h5 class="fw-bold mb-3 ps-1">Photos</h5>
            <div class="row g-3">
                <div class="col-6 col-md-5" *ngFor="let photo of displayPhotos; let i = index">
                    <div class="card border-0 shadow-sm overflow-hidden position-relative" style="aspect-ratio:1/1;">
                        <img [src]="photo.url" class="w-100 h-100 object-fit-cover" style="position:absolute; inset:0"
                            alt="Gallery">

                        <div class="position-absolute text-white d-flex align-items-center cursor-pointer"
                            style="left:8px; bottom:8px; z-index:10" (click)="onLikePhoto(i)">
                            <i class="bi" [ngClass]="photo.isLiked ? 'bi-heart-fill text-danger' : 'bi-heart'"
                                style="font-size:1.2rem; text-shadow:0 1px 3px rgba(0,0,0,.8)">
                            </i>
                        </div>
                    </div>


                </div>
            </div>
        </div>
    </div>

    <app-promo-footer></app-promo-footer>
