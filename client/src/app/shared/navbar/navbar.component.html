<nav class="navbar navbar-expand-lg bg-primary-subtle shadow-sm">
  <div class="container">
    <a class="navbar-brand" routerLink="/home">
      <img src="/logo.png" alt="Grinding Logo" height="40" />
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div
      class="collapse navbar-collapse"
      id="navbarNav"
      *ngIf="authService.currentUser$ | async as user"
    >
      <!-- LEFT SIDE -->
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/home" routerLinkActive="active">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/match" routerLinkActive="active">Match</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/messages" routerLinkActive="active">Chat</a>
        </li>
      </ul>

      <!-- RIGHT SIDE -->
      <div class="d-flex align-items-center gap-3">
        <div class="dropdown">
          <span
            class="fw-semibold dropdown-toggle"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
            style="cursor: pointer"
          >
            Hi, {{ user.name }}!
          </span>
          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <button
                class="dropdown-item text-danger d-flex align-items-center gap-2"
                (click)="authService.logout()"
              >
                <i class="bi bi-box-arrow-right"></i> Logout
              </button>
            </li>
          </ul>
        </div>

        <!-- Avatar -->
        <ng-container *ngIf="user?.pictures?.length > 0; else placeholder">
          <img [src]="user.pictures[0]" alt="User avatar" height="50" class="rounded-circle me-2 border border-2 border-primary" />
        </ng-container>

        <!-- Placeholder icon -->
        <ng-template #placeholder>
          <i class="bi bi-person-circle fs-2 text-muted"></i>
        </ng-template>

        <a routerLink="/settings" class="text-dark fs-5">
          <i class="bi bi-gear"></i>
        </a>

        <button class="btn p-0 border-0 bg-transparent fs-5">
          <i class="bi bi-bell"></i>
        </button>
      </div>
    </div>
  </div>
</nav>
