<!-- Bootstrap Modal -->
<div class="modal fade" [ngClass]="{ show: isVisible }" [style.display]="isVisible ? 'block' : 'none'" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">
          <i class="bi bi-heart-fill me-2"></i>
          It's a Match!
        </h5>
        <button type="button" class="btn-close btn-close-white me-1" (click)="onContinue()"></button>
      </div>
      <div class="modal-body text-center">
        <div class="mb-3">
          <i class="bi bi-arrow-through-heart-fill fs-1 text-danger mb-3"></i>
        </div>
        <h4 class="mb-2">You matched with {{ matchedUser?.name }}!</h4>
        <p class="text-muted mb-4">Start a conversation and see where it takes you.</p>
      </div>
      <div class="modal-footer justify-content-center">
        <button type="button" class="btn btn-outline-secondary me-2" (click)="onContinue()">
          <i class="bi bi-arrow-right-circle me-1"></i>
          Keep Matching
        </button>
        <button type="button" class="btn btn-primary" (click)="onGoToChat()">
          <i class="bi bi-chat-dots me-1"></i>
          Start Chatting
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Backdrop -->
<div class="modal-backdrop fade" [class.show]="isVisible" *ngIf="isVisible"></div>
