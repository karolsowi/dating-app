<app-navbar></app-navbar>
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div *ngIf="matchMessage" class="alert alert-success fs-4 fw-bold">
                {{ matchMessage }}
            </div>

            <div *ngIf="currentUser; else noUsers" class="card shadow-lg mx-auto user-card">
                <img [src]="currentUser.profilePic || 'https://via.placeholder.com/400x400?text=No+Image'"
                    class="card-img-top profile-img" alt="Profile Picture">
                <div class="card-body">
                    <h2 class="card-title">{{ currentUser.name }}, {{ currentUser.age }}</h2>
                    <p class="card-text text-muted">{{ currentUser.bio || 'No bio provided.' }}</p>
                    <div class="d-flex justify-content-center gap-4 mt-4">
                        <button class="btn btn-outline-danger btn-lg rounded-circle p-3" (click)="dislike()">
                            <i class="bi bi-x-lg"></i> Nope
                        </button>
                        <button class="btn btn-outline-success btn-lg rounded-circle p-3" (click)="like()">
                            <i class="bi bi-heart-fill"></i> Like
                        </button>
                    </div>
                </div>
            </div>

            <ng-template #noUsers>
                <div class="alert alert-info mt-5">
                    <h3>No more profiles to show!</h3>
                    <p>Check back later for more people.</p>
                </div>
            </ng-template>
        </div>
    </div>
</div>
