<app-navbar></app-navbar>

<div class="container mt-4">
    <div class="row">
        <!-- Recent Matches Section -->
        <div class="col-12 mb-4">
            <h5 class="text-primary fw-bold">Recent matches</h5>
            <div class="d-flex gap-3 overflow-auto py-3 matching-scroll" *ngIf="!isLoading">

                <!-- Match Card -->
                <div *ngFor="let match of recentMatches" class="card match-card shadow-sm border-0"
                    style="min-width: 200px;">
                    <div class="card-img-wrapper">
                        <img [src]="getProfileImage(match.otherUser)" class="card-img-top p-3 rounded-circle"
                            alt="Profile">
                    </div>
                    <div class="card-body bg-light-green text-dark p-2">
                        <h6 class="card-title fw-bold mb-0">{{ match.otherUser.name }}, {{ getUserAge(match.otherUser)
                            }}</h6>
                        <small class="text-muted d-block mb-2">Warsaw</small>
                        <button class="btn btn-sm btn-outline-dark w-100 bg-white border-0"
                            (click)="openChat(match.otherUser.id)">
                            <i class="bi bi-chat-dots-fill"></i>
                        </button>
                    </div>
                </div>

                <!-- Empty State -->
                <div *ngIf="recentMatches.length === 0" class="card border-0 bg-light p-4 text-center"
                    style="min-width: 200px;">
                    <p class="text-muted mb-0">No matches yet.</p>
                </div>

            </div>
        </div>

        <!-- Find a Match Button -->
        <div class="col-12 text-center my-5">
            <button class="btn btn-find-match btn-lg px-5 py-3 shadow" (click)="navigateToMatch()">
                <div class="h2 mb-0 fw-bold">Find a match!</div>
            </button>
        </div>
    </div>
</div>

<!-- Promo Footer -->
<div class="promo-footer w-100 text-center py-3 mt-auto">
    <div class="container">
        <span class="fw-bold">GRINDING+ 30% off!</span>
        Use your limited offer now! {{ timeLeft }} left until the offer ends
    </div>
</div>
